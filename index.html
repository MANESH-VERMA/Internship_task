<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster Pro - Capstone Portfolio Project</title>
    <style>
        :root {
            --primary: #1b365d;
            --secondary: #4a777a;
            --accent: #4CAF50;
            --bg: #f4f7f6;
            --white: #ffffff;
            --text: #333333;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--secondary);
        }
        .btn {
            background-color: var(--accent);
            border: none;
            color: var(--white);
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.3s, transform 0.2s;
        }
        .btn:hover {
            background-color: #43a047;
            transform: translateY(-1px);
        }
        .task-list {
            list-style: none;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: background 0.2s;
        }
        .task-item:hover {
            background: #f1f5f4;
        }
        .task-item.completed span {
            text-decoration: line-through;
            color: #888;
        }
        .task-actions {
            display: flex;
            gap: 8px;
        }
        .btn-complete {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-delete {
            background-color: #e53935;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: var(--primary);
            color: var(--white);
            font-size: 0.9rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>TaskMaster Pro</h1>
        <p>Capstone Project — Internship Mastery Showcase</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Manage Your Daily Goals</h2>
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Enter a new task or milestone...">
                <button class="btn" id="addTaskBtn">Add Task</button>
            </div>
            <ul class="task-list" id="taskList">
                <!-- Dynamic tasks will appear here -->
            </ul>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Capstone Project Completion. Built for Production.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const taskInput = document.getElementById("taskInput");
            const addTaskBtn = document.getElementById("addTaskBtn");
            const taskList = document.getElementById("taskList");

            // Load saved tasks from memory
            let tasks = JSON.parse(localStorage.getItem("capstone_tasks")) || [
                { text: "Complete internship onboarding & setup", completed: true },
                { text: "Build responsive layout & test components", completed: true },
                { text: "Deploy capstone project to GitHub Pages", completed: false }
            ];

            function renderTasks() {
                taskList.innerHTML = "";
                tasks.forEach((task, index) => {
                    const li = document.createElement("li");
                    li.className = `task-item ${task.completed ? "completed" : ""}`;
                    
                    li.innerHTML = `
                        <span>${task.text}</span>
                        <div class="task-actions">
                            <button class="btn-complete" onclick="toggleTask(${index})">${task.completed ? "Undo" : "Done"}</button>
                            <button class="btn-delete" onclick="deleteTask(${index})">Delete</button>
                        </div>
                    `;
                    taskList.appendChild(li);
                });
                localStorage.setItem("capstone_tasks", JSON.stringify(tasks));
            }

            window.addTask = function() {
                const text = taskInput.value.trim();
                if (text === "") {
                    alert("Please enter a valid task description.");
                    return;
                }
                tasks.push({ text: text, completed: false });
                taskInput.value = "";
                renderTasks();
            };

            window.toggleTask = function(index) {
                tasks[index].completed = !tasks[index].completed;
                renderTasks();
            };

            window.deleteTask = function(index) {
                tasks.splice(index, 1);
                renderTasks();
            };

            addTaskBtn.addEventListener("click", addTask);
            taskInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") addTask();
            });

            // Initial render
            renderTasks();
        });
    </script>
</body>
</html>
